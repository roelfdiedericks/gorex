<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The file's directory, which the app sets as the pane shows a file:
     relative links and images resolve against it. -->
<base id="gorex-base">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="gorex-asset://localhost/github-markdown.css">
<link rel="stylesheet" href="gorex-asset://localhost/chroma.css">
<style>
  :root {
    --gorex-body-font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --gorex-code-font: ui-monospace, Consolas, Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; background: var(--gorex-bg, transparent); }
  body { overflow-y: auto; }
  .markdown-body {
    background: transparent;
    color: var(--gorex-text, inherit);
    font-family: var(--gorex-body-font);
    padding: 12px 22px 32px 22px;
    max-width: 980px;
  }
  .markdown-body a { color: var(--gorex-accent, var(--fgColor-accent)); }
  .markdown-body pre, .markdown-body code, .markdown-body kbd, .markdown-body tt {
    font-family: var(--gorex-code-font);
  }
  .markdown-body pre.mermaid { background: transparent; text-align: center; }
  .markdown-body pre.mermaid svg { max-width: 100%; height: auto; }
  .markdown-body pre.mermaid[data-error] {
    color: var(--gorex-danger, #f85149); white-space: pre-wrap; text-align: left; font-size: 85%;
  }
  .markdown-body img { max-width: 100%; }
  #empty { color: var(--gorex-muted, #888); font-family: var(--gorex-body-font); padding: 24px; }
  #lightbox { position: fixed; inset: 0; display: none; background: rgba(0, 0, 0, 0.82); z-index: 10; overflow: auto; cursor: zoom-in; }
  #lightbox.open { display: block; }
  #lightbox.actual { cursor: zoom-out; }
  #lightbox .fit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #lightbox.actual .fit { position: static; display: block; padding: 24px; min-width: max-content; }
  #lightbox img { max-width: calc(100vw - 48px); max-height: calc(100vh - 48px); box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6); background: #fff; }
  #lightbox.actual img { max-width: none; max-height: none; }
  #lightbox .caption { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px; color: #ddd; font: 12px var(--gorex-body-font); background: linear-gradient(transparent, rgba(0, 0, 0, 0.6)); pointer-events: none; }
  #lightbox .close { position: fixed; top: 10px; right: 14px; width: 32px; height: 32px; border-radius: 16px; border: 0; background: rgba(255, 255, 255, 0.15); color: #fff; font-size: 18px; cursor: pointer; }
  #lightbox .close:hover { background: rgba(255, 255, 255, 0.3); }
</style>
</head>
<body>
<article id="content" class="markdown-body"></article>
<div id="lightbox"><div class="fit"><img alt=""></div><div class="caption"></div><button class="close" title="Close (Esc)">×</button></div>
<script src="gorex-asset://localhost/mermaid.min.js"></script>
<script src="gorex-asset://localhost/lightbox.js"></script>
<script>
(() => {
  const content = document.getElementById("content");
  let dark = false, mermaidOn = true, seq = 0;

  function initMermaid() {
    if (!window.mermaid) return;
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });
  }

  async function drawDiagrams() {
    if (!window.mermaid || !mermaidOn) return;
    const blocks = content.querySelectorAll("pre.mermaid:not([data-done])");
    let i = 0;
    for (const pre of blocks) {
      const src = pre.textContent;
      const id = "m" + (++seq) + "-" + (i++);
      try {
        const { svg } = await mermaid.render(id, src);
        pre.innerHTML = svg;
        pre.dataset.done = "1";
      } catch (e) {
        pre.textContent = src + "\n\n" + (e && e.message ? e.message : String(e));
        pre.dataset.error = "1";
        pre.dataset.done = "1";
        const stray = document.getElementById("d" + id);
        if (stray) stray.remove();
      }
    }
  }

  // setBase names the directory relative URLs resolve against, as a path
  // of the page's origin ("/C:/docs/" or "/home/me/docs/").
  window.gorexSetBase = function (path) {
    document.getElementById("gorex-base").href = new URL(path, location.href).href;
    return true;
  };

  // setContent replaces the article, keeping the scroll position when
  // asked (the same file edited), else from the top (another file).
  window.gorexSetContent = async function (html, keep) {
    const y = window.scrollY;
    content.innerHTML = html;
    for (const pre of content.querySelectorAll("pre.mermaid")) pre.dataset.src = pre.textContent;
    window.scrollTo(0, keep ? y : 0);
    await drawDiagrams();
    return true;
  };

  // setTheme sets the colors the app gives: dark, and CSS variables.
  window.gorexSetTheme = function (isDark, vars) {
    dark = !!isDark;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    for (const k in vars) document.documentElement.style.setProperty("--gorex-" + k, vars[k]);
    initMermaid();
    for (const pre of content.querySelectorAll("pre.mermaid[data-done]")) {
      delete pre.dataset.done; delete pre.dataset.error;
      if (pre.dataset.src !== undefined) pre.textContent = pre.dataset.src;
    }
    drawDiagrams();
    return true;
  };
  window.gorexSetMermaid = function (on) { mermaidOn = !!on; drawDiagrams(); return true; };
  window.gorexScrollTo = function (id) {
    const el = id ? document.getElementById(id) : null;
    if (el) el.scrollIntoView({ block: "start" }); else if (!id) window.scrollTo(0, 0);
    return !!el;
  };

  // The blocks carrying their source line, in document order, with
  // their tops in page coordinates.
  function lineMarks() {
    const marks = [];
    for (const el of content.querySelectorAll("[data-line]")) {
      const line = parseInt(el.dataset.line, 10);
      if (isNaN(line)) continue;
      const top = el.getBoundingClientRect().top + window.scrollY;
      if (marks.length && marks[marks.length - 1].line >= line) continue; // nested: the parent said it
      marks.push({ line, top, el });
    }
    return marks;
  }

  // topLine is the source line at the top of the viewport, with the
  // way into the block that spans it as a fraction, for the editor.
  window.gorexTopLine = function () {
    const marks = lineMarks();
    if (!marks.length) return 0;
    const y = window.scrollY;
    if (y <= marks[0].top) return 0;
    const atEnd = window.innerHeight + y >= document.documentElement.scrollHeight - 2;
    let i = marks.length - 1;
    while (i > 0 && marks[i].top > y) i--;
    const m = marks[i], next = marks[i + 1];
    if (!next) {
      if (atEnd) return 1e9; // the end: the editor goes to its end too
      return m.line;
    }
    const f = Math.max(0, Math.min(1, (y - m.top) / Math.max(1, next.top - m.top)));
    return m.line + f * (next.line - m.line);
  };

  // scrollToLine puts a source line at the top of the viewport.
  window.gorexScrollToLine = function (line) {
    const marks = lineMarks();
    if (!marks.length) return false;
    let i = marks.length - 1;
    while (i > 0 && marks[i].line > line) i--;
    const m = marks[i], next = marks[i + 1];
    let y = m.top;
    if (next && line > m.line) y += (next.top - m.top) * Math.min(1, (line - m.line) / (next.line - m.line));
    window.scrollTo(0, y);
    return true;
  };

  // Links: anchors scroll here, images and links to images open the
  // lightbox; everything else the app decides.
  document.addEventListener("click", (e) => {
    const img = e.target.closest && e.target.closest("#content img");
    if (img && !e.target.closest("a[href]")) {
      e.preventDefault();
      gorexLightbox(img.currentSrc || img.src, img.getAttribute("alt") || img.src.split("/").pop());
      return;
    }
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");
    if (href.startsWith("#")) {
      e.preventDefault();
      window.gorexScrollTo(decodeURIComponent(href.slice(1)));
      return;
    }
    if (isImageName(href)) {
      e.preventDefault();
      gorexLightbox(new URL(href, document.baseURI).href, decodeURIComponent(href.split("/").pop()));
      return;
    }
    // Let the navigation happen: the app's OnWillNavigate takes it.
  });
  initMermaid();
})();
</script>
</body>
</html>
